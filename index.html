<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Store | E-commerce Moderno</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho com Botão de Tema -->
    <header>
        <div class="logo">PREMIUM<span>.</span></div>
        <nav>
            <button id="btn-tema" class="btn-icone">🌙</button>
        </nav>
    </header>

    <!-- Seção Hero (Banner Principal) -->
    <section class="hero">
        <div class="hero-texto">
            <h1>O seu estilo, redefinido.</h1>
            <p>Descubra a nova coleção de alto padrão com design exclusivo.</p>
        </div>
    </section>

    <!-- Filtros de Produtos -->
    <section class="filtros-container">
        <button class="btn-filtro ativo" data-filtro="todos">Todos</button>
        <button class="btn-filtro" data-filtro="feminino">Feminino</button>
        <button class="btn-filtro" data-filtro="masculino">Masculino</button>
    </section>

    <!-- Grade de Produtos -->
    <main class="grid-produtos">
        <!-- Produto 1 -->
        <div class="card" data-categoria="feminino">
            <div class="imagem-container">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600&q=80" alt="Conjunto Verão">
                <span class="tag">Novo</span>
            </div>
            <div class="card-info">
                <h3>Conjunto Alfaiataria</h3>
                <p class="preco">R$ 289,90</p>
                <button class="btn-abrir-modal" data-nome="Conjunto Alfaiataria" data-preco="R$ 289,90" data-img="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600&q=80">Ver Detalhes</button>
            </div>
        </div>

        <!-- Produto 2 -->
        <div class="card" data-categoria="masculino">
            <div class="imagem-container">
                <img src="https://images.unsplash.com/photo-1617137968427-85924c800a22?w=600&q=80" alt="Casaco Masculino">
            </div>
            <div class="card-info">
                <h3>Sobretudo Europeu</h3>
                <p class="preco">R$ 450,00</p>
                <button class="btn-abrir-modal" data-nome="Sobretudo Europeu" data-preco="R$ 450,00" data-img="https://images.unsplash.com/photo-1617137968427-85924c800a22?w=600&q=80">Ver Detalhes</button>
            </div>
        </div>

        <!-- Produto 3 -->
        <div class="card" data-categoria="feminino">
            <div class="imagem-container">
                <img src="https://images.unsplash.com/photo-1434389673869-e08b4cac3105?w=600&q=80" alt="Bolsa Couro">
                <span class="tag tag-desconto">-20%</span>
            </div>
            <div class="card-info">
                <h3>Bolsa de Couro</h3>
                <p class="preco">R$ 199,90</p>
                <button class="btn-abrir-modal" data-nome="Bolsa de Couro" data-preco="R$ 199,90" data-img="https://images.unsplash.com/photo-1434389673869-e08b4cac3105?w=600&q=80">Ver Detalhes</button>
            </div>
        </div>
    </main>

    <!-- Modal (Janela Flutuante Escondida) -->
    <div id="modal-produto" class="modal-overlay">
        <div class="modal-conteudo">
            <button id="btn-fechar-modal" class="btn-icone fechar">✖</button>
            <img id="modal-img" src="" alt="Produto">
            <div class="modal-info">
                <h2 id="modal-titulo">Nome</h2>
                <p id="modal-preco" class="destaque">R$ 0,00</p>
                <p>Tamanhos disponíveis: P, M, G, GG</p>
                <button id="btn-comprar-whatsapp" class="btn-acao">Finalizar no WhatsApp</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
