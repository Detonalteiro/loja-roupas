<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo Carpina - Moda Masculina e Feminina</title>
    <!-- Aqui conectamos o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Estilo Carpina 👗👕</h1>
        <p>As melhores tendências da região!</p>
    </header>

    <div class="produto">
        <h2>Camiseta Básica Premium</h2>
        <p>100% Algodão. Super confortável.</p>
        <p class="preco">R$ 55,00</p>
        
        <!-- O botão agora tem um 'id' para o JavaScript conseguir achá-lo -->
        <button id="btn-comprar" class="botao">Comprar no WhatsApp</button>
        
        <!-- Uma mensagem escondida que o JavaScript vai mostrar -->
        <p id="mensagem-aviso" style="display: none; color: #128C7E; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- Aqui conectamos o arquivo JavaScript no final da página -->
    <script src="script.js"></script>
</body>
</html>
